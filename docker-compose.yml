version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-analysis-api
    ports:
      - "8000:8000"
    environment:
      - API_TITLE=Amazon Sentiment Analysis Pro
      - API_VERSION=1.0.0
      - DEBUG=false
      - DATABASE_URL=sqlite:///./sentiment_analysis.db
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./sentiment_analysis.db:/app/sentiment_analysis.db
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sentiment-network

networks:
  sentiment-network:
    driver: bridge
